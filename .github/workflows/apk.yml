# Builds the DSMO APK on GitHub's x86_64 Linux runners (dsh-Go's runtime
# build needs x86_64 Linux). Run it from the Actions tab: “Build APK” › Run workflow.
# The APK is attached to the run as an artifact.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: arm64 (phones) or x64 (emulators)
        default: arm64
        type: choice
        options: [arm64, x64]
      update_repo:
        description: owner/repo for in-app updates (optional)
        default: ''
        type: string
      version:
        description: App version (e.g. 1.3.1) when releasing more than once on the same dsh-Go version (optional; empty = dsh-Go's)
        default: ''
        type: string

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The toolchain (JDK, Flutter, Android SDK/NDK, an emulator image) and the
      # runtime need well over 15 GB; drop what the runner image ships and we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tools dsh-Go's scripts expect
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends zstd file xz-utils unzip gpgv

      - name: Cache dsh-Go toolchain and runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/dev/.downloads
            build-apk/dsh-go/runtime/.cache
          key: dshgo-${{ hashFiles('native/BASE') }}

      # DSMO's one signing key (repository secrets). Android only installs an update signed with
      # the same key; without it every runner would sign with its own random debug key and each
      # APK would need an uninstall (which wipes the app's data).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DSMO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret DSMO_KEYSTORE_BASE64 is missing: the APK could not update the installed one"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dsmo-release.p12"
          echo "DSMO_KEYSTORE=$RUNNER_TEMP/dsmo-release.p12" >> "$GITHUB_ENV"

      # Gradle's downloads (plugins, Maven dependencies) between builds: Maven Central answers
      # GitHub's shared runners with 429 Too Many Requests now and then.
      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: dsmo-gradle-${{ hashFiles('native/BASE') }}

      - name: Pre-download Flutter from official CDN
        run: |
          mkdir -p ~/dev/.downloads
          if [ ! -f ~/dev/.downloads/flutter_linux_3.47.7-stable.tar.xz ]; then
            curl -fL --retry 3 -o ~/dev/.downloads/flutter_linux_3.47.7-stable.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz"
          fi

      - name: Build
        env:
          ABI: ${{ inputs.abi }}
          API_DEMO_UPDATE_REPO: ${{ inputs.update_repo }}
          DSMO_VERSION: ${{ inputs.version }}
          DSMO_KEYSTORE_PASSWORD: ${{ secrets.DSMO_KEYSTORE_PASSWORD }}
          DSMO_KEY_ALIAS: ${{ secrets.DSMO_KEY_ALIAS }}
          # GitHub's runners reach Google's and Maven Central's repositories directly;
          # dsh-Go's Gradle files skip their China mirrors when this is 0.
          DSH_MAVEN_MIRRORS: '0'
        run: bash native/build-apk.sh build-apk

      - uses: actions/upload-artifact@v4
        with:
          name: dsmo-${{ inputs.abi }}-apk
          path: dist-apk/*.apk
          if-no-files-found: error
